<!doctype html><html lang="zh"><meta charset="utf-8"><title>AI Village map candidate</title><style>body{margin:0;padding:20px;background:#f3eddf;color:#35463d;font:15px system-ui}h1{font-size:21px}p{max-width:880px;line-height:1.6}button{font:inherit;min-height:44px;border:1px solid #a79c85;border-radius:12px;background:#fff9ea;color:#35463d;padding:8px 14px;margin:3px}button:focus-visible{outline:3px solid #32657e}#map{position:relative;width:min(100%,1000px);aspect-ratio:4/3;isolation:isolate;border-radius:18px;overflow:hidden;background:#c3d0a1}#map>.terrain,#map>.roads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.node{position:absolute;width:22%;height:27%;transform:translate(-50%,-50%);margin:0;padding:0;border:0;background:transparent;min-height:0}.node img{width:100%;height:100%;object-fit:contain;pointer-events:none}.node span{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;font-size:clamp(10px,1.3vw,15px);padding:3px 8px;border-radius:15px;background:#fff5dfed;border:1px solid #b4a88d}.node[aria-pressed=true] span{background:#345a62;color:#fff}.node.planned img{filter:saturate(.75)}#list{display:flex;max-width:1000px;flex-wrap:wrap}#detail{padding:16px 0;min-height:60px}body.dark{background:#263131;color:#eee3cb}body.dark button{background:#354440;color:#eee3cb}body.dark .node{background:transparent}body.dark .node span{color:#35463d}body.dark .node[aria-pressed=true] span{color:white}@media(max-width:400px){body{padding:10px}.node{pointer-events:none}.node span{display:none}#list{display:grid;grid-template-columns:1fr}#list button{text-align:left}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><h1>社区地图 · 已批准地图美术</h1><p id="notice">地图美术已获批准；此页仍是独立预览。下方地点仅选择预览，不执行旅行。地形、五个地标、道路和标签独立。</p><button id="lang">English</button><button id="theme">浅 / 深</button><div id="map"><img class="terrain" src="map-terrain-v01.png"><img class="roads" src="map-roads.svg"><button class="node open" data-id="courtyard" style="left:55.00000000000001%;top:45%" aria-pressed="false"><img src="landmark-courtyard-v01.png"><span></span></button><button class="node open" data-id="bookhouse" style="left:22%;top:33%" aria-pressed="false"><img src="landmark-bookhouse-v01.png"><span></span></button><button class="node planned" data-id="tea-square" style="left:60%;top:72%" aria-pressed="false"><img src="landmark-tea-square-v01.png"><span></span></button><button class="node planned" data-id="lakeside-garden" style="left:76%;top:18%" aria-pressed="false"><img src="landmark-lakeside-garden-v01.png"><span></span></button><button class="node planned" data-id="workshop" style="left:23%;top:82%" aria-pressed="false"><img src="landmark-workshop-v01.png"><span></span></button></div><div id="list"></div><div id="detail" aria-live="polite"></div><script>const nodes=[{"id":"courtyard","center":[0.55,0.45],"name":["白鲸小院","Whale Courtyard"],"status":"open"},{"id":"bookhouse","center":[0.22,0.33],"name":["AI 书屋","AI Bookhouse"],"status":"open"},{"id":"tea-square","center":[0.6,0.72],"name":["茶会广场","Tea Square"],"status":"planned"},{"id":"lakeside-garden","center":[0.76,0.18],"name":["湖畔花园","Lakeside Garden"],"status":"planned"},{"id":"workshop","center":[0.23,0.82],"name":["AI 工坊","AI Workshop"],"status":"planned"}];let language=0,selected="courtyard";function render(){document.documentElement.lang=language?"en":"zh";document.querySelector("h1").textContent=language?"Community map · approved map art":"社区地图 · 已批准地图美术";document.querySelector("#notice").textContent=language?"Map art approved; this page remains an isolated preview. Select places to preview; this page never travels. Terrain, five landmarks, roads and labels are independent.":"地图美术已获批准；此页仍是独立预览。下方地点仅选择预览，不执行旅行。地形、五个地标、道路和标签独立。";document.querySelector("#lang").textContent=language?"中文":"English";document.querySelector("#theme").textContent=language?"Light / Dark":"浅 / 深";document.querySelector("#list").replaceChildren(...nodes.map(n=>{const b=document.createElement("button");b.dataset.id=n.id;b.textContent=n.name[language]+(n.status==="planned"?(language?" · Planned":" · 规划中"):"");return b}));for(const el of document.querySelectorAll(".node")){const n=nodes.find(n=>n.id===el.dataset.id);el.querySelector("span").textContent=n.name[language];el.setAttribute("aria-label",n.name[language]);el.setAttribute("aria-pressed",String(n.id===selected))}const n=nodes.find(n=>n.id===selected);document.querySelector("#detail").textContent=n.name[language]+" — "+(language?"Art candidate preview only. Travel is unavailable here.":"美术候选预览；本页不执行旅行。")}document.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b){selected=b.dataset.id;render()}});document.querySelector("#lang").onclick=()=>{language=1-language;render()};document.querySelector("#theme").onclick=()=>document.body.classList.toggle("dark");render();</script></html>
