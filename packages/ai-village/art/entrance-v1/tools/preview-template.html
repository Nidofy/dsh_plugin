<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>梦境庭院入口 · 美术检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae7dc;color:#354536;font:14px/1.6 system-ui,sans-serif}header{padding:16px 24px;max-width:1200px;margin:auto}h1{font-size:24px;margin:0}p{margin:4px 0 14px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{background:#fffaf0;border:1px solid #b8bea8;border-radius:8px;padding:8px 12px;color:inherit;font:inherit}label{display:flex;gap:6px;align-items:center}input{width:130px}main{overflow:auto;padding:8px 24px 32px}.viewport{position:relative;overflow:hidden;margin:auto;isolation:isolate;background:#c8c4b9}.world,.side,.stage,.exterior,.perspective,.frame{position:absolute;inset:0}.world{background:url('../../assets/scenes/courtyard/background.png') center/auto 100% no-repeat,#e7dfc5}.world.checker{background:repeating-conic-gradient(#a9aaa5 0 25%,#dddcd5 0 50%) 0/32px 32px}.side{background:url('source/environment-clean-original.png') center/cover;filter:blur(14px)}.stage{transform-origin:0 0}.stage img{position:absolute;width:100%;height:100%;inset:0;pointer-events:none}.exterior{mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent)}.perspective{transform-style:preserve-3d}.perspective img{backface-visibility:hidden}.status{position:absolute;left:8px;right:8px;bottom:12%;text-align:center;padding:12px;border-radius:16px;background:#fff6e0b8}.dark .status{background:#252c25b8;color:#eee8d9}.portraits{display:flex;justify-content:center;gap:8px}.portraits img{width:32px;height:40px;object-fit:contain}.status small{display:block;margin-top:8px}.notice{position:absolute;top:10px;left:10px;background:#fff8e3d9;border-radius:8px;padding:4px 8px;font-size:12px}.foot{max-width:1100px;margin:auto;padding:0 24px 24px}a{color:#486c4c}
</style>
<header><h1>梦境庭院入口</h1><p>ART_REVIEW · 本地分层素材检查。门内为现有庭院静态样例或透明棋盘格，头像为固定示例，不代表真实加载进度。</p>
<div class="controls"><select id="size"><option>340×720</option><option selected>580×720</option><option>1080×760</option></select><button id="play">播放美术动画</button><label>开门 <input id="door" type="range" min="0" max="100" value="0"><output id="value">0%</output></label><label>镜头 <input id="zoom" type="range" min="100" max="145" value="100"></label><label>视差 <input id="parallax" type="range" min="-5" max="5" value="0" step=".1"></label><button id="bg">切换棋盘格</button><button id="theme">明 / 暗宿主</button><button id="ui">头像条</button></div></header>
<main><div class="viewport" id="viewport"><div class="world" id="world"></div><div class="side" id="side"></div><div class="stage" id="stage"><div class="exterior" id="exterior"></div><div class="perspective" id="perspective"></div><div class="frame" id="frame"></div></div><div class="notice">素材动画预览 · 非运行中游戏</div><div class="status" id="status"><div class="portraits" id="portraits"></div><small>正在准备小院…（固定示例）</small></div></div></main>
<div class="foot">左右门扇采用向内 0–82° 透视；门框与所有环境层共用弧形门洞。<a href="../../assets/boot/ART_HANDOFF.md">交接说明</a> · <a href="previews/contact-sheet.png">总览图</a> · <a href="../../assets/boot/validation.json">像素验证结果</a></div>
<script>
const art=/*MANIFEST*/;
const $=id=>document.getElementById(id);const env=[];let playing=false,start=0,af=0;
for(const l of art.layers){if(l.optional)continue;const im=new Image();im.src='../../assets/boot/'+l.file;im.alt=l.id;im.dataset.id=l.id;
if(l.id==='gate-frame')$('frame').append(im);else if(l.id==='gate-left'||l.id==='gate-right'){const p=art.doors.transformOriginFullCanvas[l.id];im.style.transformOrigin=`${p[0]*100}% ${p[1]*100}%`;$('perspective').append(im);}else{$('exterior').append(im);env.push([im,l.parallax]);}}
for(const name of ['bluewhale','claude','gemini','gpt','grok','kimi','qwen']){const im=new Image();im.src='../../assets/portraits/'+name+'.png';im.alt=name;$('portraits').append(im);}
const polygon=art.portal.polygonPx;function outside(points,w,h){return 'polygon(evenodd,0% 0%,100% 0%,100% 100%,0% 100%,0% 0%,'+points.map(([x,y])=>`${x/w*100}% ${y/h*100}%`).join(',')+`,${points[0][0]/w*100}% ${points[0][1]/h*100}%)`;}
$('exterior').style.clipPath=outside(polygon,1080,1440);
function draw(progress=null){const [w,h]=$('size').value.split('×').map(Number);$('viewport').style.width=w+'px';$('viewport').style.height=h+'px';let zoom=+$('zoom').value/100,focus=[540,720],amount=+$('door').value/100,opacity=1;
if(progress!==null){if(progress<.25){zoom=1+.12*progress/.25;focus=[540,720-45*progress/.25];amount=0;}else if(progress<.6){zoom=1.12;focus=[540,675];amount=(progress-.25)/.35;}else{const t=Math.min(1,(progress-.6)/.32);const end=1.06*Math.max(w/(325*h/1440),h/(275*h/1440));zoom=1.12+(end-1.12)*t*t;focus=[540+2.5*t,675+12.5*t];amount=1;opacity=progress>.92?Math.max(0,(1-progress)/.08):1;}}
const s=h/1440,sw=1080*s;const ox=w/2-focus[0]*s*zoom,oy=h/2-focus[1]*s*zoom;Object.assign($('stage').style,{width:sw+'px',height:h+'px',transform:`translate(${ox}px,${oy}px) scale(${zoom})`,opacity});$('perspective').style.perspective=2100*s+'px';
for(const [im,p] of env)im.style.transform=`translateX(${+$('parallax').value*p*s}px)`;
for(const im of $('perspective').children)im.style.transform=`rotateY(${amount*82*(im.dataset.id==='gate-left'?1:-1)}deg)`;
const vp=polygon.map(([x,y])=>[ox+x*s*zoom,oy+y*s*zoom]);$('side').style.clipPath=outside(vp,w,h);$('side').style.opacity=opacity;$('value').value=Math.round(amount*100)+'%';}
function tick(t){if(!playing)return;const p=Math.min(1,(t-start)/6000);draw(p);if(p<1)af=requestAnimationFrame(tick);else{playing=false;$('play').textContent='重播美术动画';}}
function stop(){playing=false;cancelAnimationFrame(af);$('play').textContent='播放美术动画';draw();}
$('play').onclick=()=>{if(playing){stop();return;}playing=true;start=performance.now();$('play').textContent='停止预览';af=requestAnimationFrame(tick);};
for(const id of ['size','door','zoom','parallax'])$(id).oninput=stop;
$('bg').onclick=()=>{$('world').classList.toggle('checker');};$('theme').onclick=()=>{$('viewport').classList.toggle('dark');document.body.style.background=$('viewport').classList.contains('dark')?'#232b26':'#eae7dc';};$('ui').onclick=()=>{$('status').hidden=!$('status').hidden;};draw();
</script></html>
